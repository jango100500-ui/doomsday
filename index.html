<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MCU">
<meta name="theme-color" content="#ffffff">
<title>MCU</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f7f7;--surface:#fff;--surface-soft:#f2f2f2;--line:#c9c9c9;
  --border:#dedede;--text:#111;--muted:#737373;--rail:#fff;
  --black:#111;--white:#fff;--panel:#fff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#151617;--surface:#1b1c1d;--surface-soft:#252627;--line:#555;
  --border:#373839;--text:#f4f4f4;--muted:#a0a0a0;--rail:#18191a;
  --black:#f4f4f4;--white:#151617;--panel:#1b1c1d;color-scheme:dark;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button,input,textarea{font:inherit}
button{color:inherit}
#app{height:100dvh;display:flex;overflow:hidden}
.rail{
  width:78px;flex:0 0 78px;background:var(--rail);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;z-index:20
}
.brand{width:100%;height:74px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0}
.nav-btn{
  width:40px;height:40px;border:0;background:transparent;border-radius:11px;display:grid;place-items:center;
  cursor:pointer;opacity:.72;transition:background .15s,opacity .15s,transform .15s
}
.nav-btn:hover{background:var(--surface-soft);opacity:1}.nav-btn:active{transform:scale(.94)}
.nav-btn.active{opacity:1;background:var(--surface-soft)}
.nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.main{min-width:0;flex:1;display:flex;flex-direction:column;overflow:hidden}
.top{
  min-height:74px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:20px
}
.saga-meta{display:flex;align-items:flex-end;gap:28px;min-width:0}
.eyebrow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.saga-title{font-size:20px;font-weight:750;line-height:1}
.progress{display:flex;align-items:center;gap:12px;padding-bottom:1px}
.progress span{font-size:12px;font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap}
.track{width:150px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.fill{height:100%;width:0;background:var(--black);border-radius:2px;transition:width .35s ease}
.top-actions{display:flex;gap:8px}
.round-btn{width:34px;height:34px;border:1px solid var(--border);border-radius:10px;background:var(--surface);display:grid;place-items:center;cursor:pointer}
.round-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.content{flex:1;overflow:auto;padding:30px 34px 60px}
.content-inner{width:min(760px,100%);margin:0 auto}
.next{
  display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin:0 0 25px 2px
}
.next b{font-weight:600;color:var(--text)}
.timeline{position:relative;padding:5px 0 30px}
.timeline:before{
  content:"";position:absolute;top:14px;bottom:25px;left:50%;width:1px;background:var(--line);transform:translateX(-50%)
}
.item{position:relative;display:grid;grid-template-columns:1fr 58px 1fr;min-height:102px;align-items:start}
.node-wrap{grid-column:2;display:flex;justify-content:center;position:relative;z-index:2}
.node{
  width:32px;height:32px;border:1px solid #8f8f8f;border-radius:50%;background:var(--surface);
  display:grid;place-items:center;font-size:10px;font-weight:650;color:var(--text);transition:transform .2s,background .2s,border .2s
}
.node.watched,.node.current{background:var(--black);border-color:var(--black);color:var(--white)}
.node.current{box-shadow:0 0 0 5px color-mix(in srgb,var(--black) 12%,transparent)}
.node.watched .num{display:none}
.node.watched:after{content:"✓";font-size:12px}
.card{padding-top:2px;min-width:0}
.left .card{text-align:right;padding-right:17px}
.right .card{text-align:left;padding-left:17px}
.item.left .card{grid-column:1;grid-row:1}
.item.right .card{grid-column:3;grid-row:1}
.item.left .node-wrap,.item.right .node-wrap{grid-column:2;grid-row:1}
.name{font-size:11px;line-height:1.35;font-weight:600;color:var(--text);max-width:240px}
.left .name{margin-left:auto}
.year{font-size:10px;color:var(--muted);margin-top:4px}
.branch{
  position:absolute;top:15px;height:1px;background:var(--line);width:calc(50% - 29px);z-index:0
}
.item.left .branch{right:calc(50% + 29px)}.item.right .branch{left:calc(50% + 29px)}
.end{
  display:flex;justify-content:center;position:relative;z-index:2;margin-top:-4px
}
.end .node{border-style:dashed;color:var(--muted)}
.legend{
  display:flex;justify-content:center;gap:22px;flex-wrap:wrap;color:var(--muted);font-size:10px;margin-top:4px
}
.legend span{display:flex;align-items:center;gap:7px}
.legend .sample-line{width:28px;height:1px;background:var(--line)}
.legend .sample-dash{width:28px;border-top:1px dashed var(--line)}
.legend .sample-node{width:13px;height:13px;border:1px solid #999;border-radius:50%}
.legend .sample-current{width:13px;height:13px;border-radius:50%;background:var(--black)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.overlay.show{opacity:1;pointer-events:auto}
.panel{
  position:fixed;right:22px;top:50%;transform:translate(30px,-50%);width:min(330px,calc(100vw - 40px));
  max-height:calc(100dvh - 44px);overflow:auto;background:var(--panel);border:1px solid var(--border);
  border-radius:16px;padding:16px;z-index:60;opacity:0;pointer-events:none;transition:transform .25s ease,opacity .2s;
  box-shadow:0 18px 50px rgba(0,0,0,.13)
}
.panel.show{opacity:1;pointer-events:auto;transform:translate(0,-50%)}
.close{position:absolute;right:12px;top:12px;width:28px;height:28px;border:0;border-radius:50%;background:var(--surface-soft);display:grid;place-items:center;cursor:pointer}
.close svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.p-num{display:inline-flex;padding:3px 7px;border-radius:8px;background:var(--surface-soft);font-size:10px;color:var(--muted);margin-bottom:7px}
.p-title{font-size:18px;line-height:1.22;font-weight:750;padding-right:32px}
.p-meta{font-size:11px;color:var(--muted);margin:5px 0 13px}
.poster{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--surface-soft);margin-bottom:12px}
.watch{width:100%;height:38px;border:0;border-radius:9px;background:var(--black);color:var(--white);font-size:12px;font-weight:650;cursor:pointer}
.watch.off{background:var(--surface-soft);color:var(--text)}
.sec{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:15px 0 7px}
.stars{display:flex;gap:3px}.star{border:0;background:transparent;font-size:20px;line-height:1;color:var(--border);cursor:pointer;padding:0 2px}.star.on{color:#111}
[data-theme="dark"] .star.on{color:#f4f4f4}
.notes{width:100%;min-height:70px;resize:vertical;border:1px solid var(--border);background:var(--surface-soft);color:var(--text);border-radius:9px;padding:9px;font-size:11px;outline:0}
.notes:focus{border-color:var(--text)}
.save{margin-top:7px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 13px;font-size:11px;cursor:pointer}
.date{font-size:11px;color:var(--muted)}
.lang-menu{
  position:fixed;right:25px;top:64px;background:var(--surface);border:1px solid var(--border);border-radius:11px;
  padding:5px;z-index:70;display:none;box-shadow:0 12px 30px rgba(0,0,0,.12)
}
.lang-menu.show{display:block}.lang-menu button{display:block;width:130px;border:0;background:transparent;text-align:left;padding:8px;border-radius:7px;font-size:11px;cursor:pointer}.lang-menu button:hover{background:var(--surface-soft)}
@media(max-width:760px){
  body{overflow:hidden}
  #app{display:block}
  .rail{width:100%;height:58px;border-right:0;border-bottom:1px solid var(--border);display:flex;flex-direction:row;justify-content:space-between;align-items:center;padding:0 12px}
  .brand{width:auto;height:100%;border:0;padding:0 8px;font-size:15px}
  .nav{flex-direction:row;padding:0;gap:3px}.nav-btn{width:36px;height:36px}
  .main{height:calc(100dvh - 58px)}
  .top{min-height:82px;padding:15px 16px;align-items:center}
  .saga-meta{gap:18px}.saga-title{font-size:18px}.progress{gap:8px}.track{width:72px}
  .content{padding:22px 13px 48px}.content-inner{max-width:560px}
  .next{margin-bottom:20px;padding-left:3px}
  .timeline:before{top:14px;bottom:22px}
  .item{grid-template-columns:1fr 48px 1fr;min-height:92px}
  .node{width:30px;height:30px;font-size:9px}
  .left .card{padding-right:11px}.right .card{padding-left:11px}
  .name{font-size:10px;max-width:145px}.year{font-size:9px;margin-top:3px}
  .branch{width:calc(50% - 24px)}.item.left .branch{right:calc(50% + 24px)}.item.right .branch{left:calc(50% + 24px)}
  .legend{gap:13px;font-size:9px}
  .panel{left:10px;right:10px;bottom:10px;top:auto;width:auto;max-height:82dvh;transform:translateY(25px);border-radius:16px;padding:15px}
  .panel.show{transform:translateY(0)}
  .poster{aspect-ratio:16/9}
  .lang-menu{top:50px;right:10px}
}
@media(max-width:390px){
  .nav-btn:nth-child(n+4){display:none}
  .saga-meta{gap:12px}.saga-title{font-size:17px}.progress span{font-size:11px}.track{width:55px}
  .item{grid-template-columns:1fr 42px 1fr;min-height:88px}.left .card{padding-right:9px}.right .card{padding-left:9px}
  .name{font-size:9.5px}.year{font-size:8.5px}
  .branch{width:calc(50% - 21px)}.item.left .branch{right:calc(50% + 21px)}.item.right .branch{left:calc(50% + 21px)}
}
</style>
</head>

const TR={
en:{saga:"SAGA",next:"Next up:",rating:"Your Rating",notes:"Notes",save:"Save",date:"Watched on",mark:"Mark as watched",unmark:"Remove from watched",ph:"Write a note…",of:"of",done:"All watched!"},
de:{saga:"SAGA",next:"Als Nächstes:",rating:"Deine Bewertung",notes:"Notizen",save:"Speichern",date:"Gesehen am",mark:"Als gesehen markieren",unmark:"Als ungesehen markieren",ph:"Notiz schreiben…",of:"von",done:"Alle gesehen!"},
ru:{saga:"САГА",next:"Следующий:",rating:"Ваша оценка",notes:"Заметки",save:"Сохранить",date:"Просмотрено",mark:"Отметить просмотренным",unmark:"Убрать отметку",ph:"Написать заметку…",of:"из",done:"Все просмотрено!"}
};
let S={theme:"auto",lang:"en",watched:{}},activeId=null;
function load(){try{const x=localStorage.getItem("mcu2");if(x)S={...S,...JSON.parse(x)}}catch(e){}}
function save(){localStorage.setItem("mcu2",JSON.stringify(S))}
function t(k){return (TR[S.lang]||TR.en)[k]||k}
function dark(){return S.theme==="dark"||(S.theme==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches)}
function applyTheme(){
  document.documentElement.toggleAttribute("data-theme",false);
  if(S.theme!=="auto")document.documentElement.setAttribute("data-theme",S.theme);
  const sun=`<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>`;
  const moon=`<path d="M20 15.2A8.2 8.2 0 0 1 8.8 4a8.3 8.3 0 1 0 11.2 11.2Z"/>`;
  document.getElementById("theme-icon").innerHTML=dark()?moon:sun;
}
function update(){
  const c=Object.keys(S.watched).length,total=FILMS.length;
  document.getElementById("progress").textContent=`${c} ${t("of")} ${total}`;
  document.getElementById("fill").style.width=`${c/total*100}%`;
  const next=FILMS.find(f=>!S.watched[f.id]);
  document.getElementById("next-label").textContent=t("next");
  document.getElementById("next-title").textContent=next?`${next.id}. ${next.title}`:t("done");
  document.getElementById("saga-label").textContent=t("saga");
}
function build(){
  const tl=document.getElementById("timeline");tl.innerHTML="";
  FILMS.forEach((f,i)=>{
    const w=S.watched[f.id], current=!w&&FILMS.find(x=>!S.watched[x.id])?.id===f.id;
    const side=i%2===0?"left":"right";
    const el=document.createElement("article");el.className=`item ${side}`;
    el.innerHTML=`<div class="card"><div class="name">${f.title}</div><div class="year">${f.year}</div></div>
      <div class="node-wrap"><button class="node ${w?"watched":current?"current":""}" aria-label="${f.title}">${f.id}</button></div>
      <span class="branch"></span>`;
    el.addEventListener("click",()=>open(f.id));tl.appendChild(el);
  });
  const end=document.createElement("div");end.className="end";end.innerHTML='<div class="node">…</div>';tl.appendChild(end);
}
function open(id){
  activeId=id;render();document.getElementById("panel").classList.add("show");document.getElementById("overlay").classList.add("show");
}
function close(){document.getElementById("panel").classList.remove("show");document.getElementById("overlay").classList.remove("show");activeId=null}
function render(){
  const f=FILMS.find(x=>x.id===activeId),w=S.watched[activeId],is=!!w;
  document.getElementById("p-num").textContent=`#${f.id}`;
  document.getElementById("p-title").textContent=f.title;
  document.getElementById("p-meta").textContent=`${f.year} · ${f.rt}`;
  const p=document.getElementById("poster");p.src=f.poster;p.alt=f.title;
  const b=document.getElementById("watch");b.textContent=is?t("unmark"):t("mark");b.className="watch"+(is?" off":"");
  document.getElementById("rating-label").textContent=t("rating");
  document.getElementById("notes-label").textContent=t("notes");
  document.getElementById("notes").placeholder=t("ph");document.getElementById("notes").value=w?.note||"";
  document.getElementById("save-note").textContent=t("save");
  const db=document.getElementById("date-block");
  if(is&&w.date){db.style.display="block";document.getElementById("date-label").textContent=t("date");document.getElementById("date").textContent=new Date(w.date).toLocaleDateString({en:"en-US",de:"de-DE",ru:"ru-RU"}[S.lang],{day:"numeric",month:"long",year:"numeric"})}else db.style.display="none";
  const stars=document.getElementById("stars");stars.innerHTML="";
  for(let i=1;i<=5;i++){const s=document.createElement("button");s.className="star"+(i<=(w?.rating||0)?" on":"");s.textContent="★";s.addEventListener("click",()=>rate(i));stars.appendChild(s)}
}
function toggle(id){
  if(S.watched[id])delete S.watched[id];else S.watched[id]={date:new Date().toISOString(),rating:0,note:""};
  save();build();update();render();
}
function rate(n){
  if(!S.watched[activeId])toggle(activeId);
  const cur=S.watched[activeId].rating||0;S.watched[activeId].rating=cur===n?0:n;save();render();build();update()
}
document.getElementById("watch").onclick=()=>activeId&&toggle(activeId);
document.getElementById("save-note").onclick=()=>{
  if(!activeId)return;
  if(!S.watched[activeId])toggle(activeId);
  S.watched[activeId].note=document.getElementById("notes").value.trim();save();build();update();
  const b=document.getElementById("save-note");const old=b.textContent;b.textContent="✓";setTimeout(()=>b.textContent=old,900);
};
document.getElementById("close").onclick=close;document.getElementById("overlay").onclick=close;
document.getElementById("theme-btn").onclick=()=>{S.theme={auto:"dark",dark:"light",light:"auto"}[S.theme];save();applyTheme()};
document.getElementById("lang-btn").onclick=e=>{e.stopPropagation();document.getElementById("lang-menu").classList.toggle("show")};
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;save();document.getElementById("lang-menu").classList.remove("show");update();if(activeId)render()});
document.addEventListener("click",e=>{if(!e.target.closest("#lang-menu")&&!e.target.closest("#lang-btn"))document.getElementById("lang-menu").classList.remove("show")});
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{if(S.theme==="auto")applyTheme()});
load();applyTheme();build();update();
</script>
</body>
</html>
